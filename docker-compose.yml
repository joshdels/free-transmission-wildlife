services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: free-transmission-wildlife

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

    volumes:
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
